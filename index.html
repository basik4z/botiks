<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДААСС</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; padding: 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .logo { font-size: 48px; font-weight: 800; background: linear-gradient(135deg, #6ee7ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; margin: 16px 0; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6ee7ff, #a855f7); border: none; border-radius: 40px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .footer { text-align: center; padding: 20px; color: #6a6f7a; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><div class="logo">ДААСС</div><p>Твой помощник в Telegram</p></div>
        <div class="card"><h3>📊 Статистика</h3><p>Сообщений сохранено: 0</p><p>Удалений отслежено: 0</p></div>
        <button class="btn" onclick="tg.close()">🔐 Закрыть</button>
        <div class="footer">ДААСС v2.0</div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
