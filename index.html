<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДААСС — твой помощник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; padding: 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .logo { font-size: 48px; font-weight: 800; background: linear-gradient(135deg, #6ee7ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; margin: 16px 0; }
        .card h3 { margin-bottom: 12px; color: #6ee7ff; }
        .feature { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .feature:last-child { border-bottom: none; }
        .feature-icon { font-size: 28px; width: 40px; }
        .stat { display: flex; justify-content: space-between; padding: 8px 0; }
        .stat-value { color: #a855f7; font-weight: bold; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6ee7ff, #a855f7); border: none; border-radius: 40px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .btn:active { transform: scale(0.97); }
        .footer { text-align: center; padding: 20px; color: #6a6f7a; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">ДААСС</div>
            <p style="color: #8e9aaf; margin-top: 8px;">Твой помощник в Telegram</p>
        </div>

        <div class="card">
            <h3>📊 Статистика</h3>
            <div class="stat"><span>Сообщений сохранено</span><span class="stat-value" id="msgCount">0</span></div>
            <div class="stat"><span>Удалений отслежено</span><span class="stat-value" id="delCount">0</span></div>
            <div class="stat"><span>Изменений отслежено</span><span class="stat-value" id="editCount">0</span></div>
        </div>

        <div class="card">
            <h3>⚡ Возможности</h3>
            <div class="feature"><span class="feature-icon">📦</span><span>Удалённые сообщения</span></div>
            <div class="feature"><span class="feature-icon">✏️</span><span>Изменённые сообщения</span></div>
            <div class="feature"><span class="feature-icon">👁</span><span>View Once</span></div>
            <div class="feature"><span class="feature-icon">📤</span><span>Экспорт чата (HTML)</span></div>
        </div>

        <button class="btn" onclick="tg.close()">🔐 Закрыть приложение</button>
        <div class="footer">ДААСС v2.0 • Работает на Render</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Имитация статистики (можно заменить на запрос к боту)
        document.getElementById('msgCount').textContent = '124';
        document.getElementById('delCount').textContent = '7';
        document.getElementById('editCount').textContent = '3';
    </script>
</body>
</html>
