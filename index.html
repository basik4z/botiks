<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ДААСС</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            padding: 16px; 
            min-height: 100vh;
        }
        .container { max-width: 480px; margin: 0 auto; }

        /* Хедер */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 20px; }
        .logo { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #6ee7ff, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 6px 12px 6px 6px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #2a2a3a; }
        .user-name { font-size: 13px; font-weight: 500; }

        /* Карточки статистики */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-number { font-size: 22px; font-weight: 700; color: #6ee7ff; }
        .stat-label { font-size: 11px; color: #8e9aaf; margin-top: 4px; }

        /* Особенности */
        .features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .feature { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .feature-icon { font-size: 28px; }
        .feature-title { font-size: 13px; font-weight: 600; margin-top: 6px; }

        /* Тарифы */
        .plans { display: flex; gap: 10px; margin-bottom: 20px; }
        .plan { flex: 1; background: rgba(255,255,255,0.03); border-radius: 16px; padding: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; }
        .plan.active { border-color: #a855f7; background: rgba(168,85,247,0.1); }
        .plan-price { font-size: 20px; font-weight: 700; color: #fbbf24; }
        .plan-name { font-size: 13px; color: #8e9aaf; }

        /* Кнопки */
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6ee7ff, #a855f7); border: none; border-radius: 40px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 12px; }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; }

        /* Рефералка */
        .referral { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; }
        .ref-link { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; font-size: 12px; word-break: break-all; margin-top: 8px; color: #8e9aaf; }

        /* Футер */
        .footer { text-align: center; padding: 16px; color: #5a667a; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">

        <!-- Хедер -->
        <div class="header">
            <div class="logo">ДААСС</div>
            <div class="user-badge">
                <img class="user-avatar" id="userAvatar" src="">
                <span class="user-name" id="userName">Гость</span>
            </div>
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="msgCount">0</div><div class="stat-label">Сообщений</div></div>
            <div class="stat-card"><div class="stat-number" id="delCount">0</div><div class="stat-label">Удалений</div></div>
            <div class="stat-card"><div class="stat-number" id="editCount">0</div><div class="stat-label">Изменений</div></div>
        </div>

        <!-- Особенности -->
        <div class="features">
            <div class="feature"><div class="feature-icon">📦</div><div class="feature-title">Удалённые</div></div>
            <div class="feature"><div class="feature-icon">✏️</div><div class="feature-title">Изменённые</div></div>
            <div class="feature"><div class="feature-icon">👁</div><div class="feature-title">View Once</div></div>
            <div class="feature"><div class="feature-icon">📤</div><div class="feature-title">Экспорт</div></div>
        </div>

        <!-- Тарифы -->
        <div class="plans">
            <div class="plan" data-days="7" data-price="50"><div class="plan-price">50 ⭐</div><div class="plan-name">Неделя</div></div>
            <div class="plan active" data-days="30" data-price="150"><div class="plan-price">150 ⭐</div><div class="plan-name">Месяц</div></div>
            <div class="plan" data-days="365" data-price="550"><div class="plan-price">550 ⭐</div><div class="plan-name">Год</div></div>
        </div>

        <!-- Рефералка -->
        <div class="referral">
            <div>🔗 Реферальная программа</div>
            <div class="ref-link" id="refLink">Загрузка...</div>
            <div style="font-size: 11px; color: #8e9aaf; margin-top: 4px;">+7 дней за каждого друга</div>
        </div>

        <!-- Кнопки -->
        <button class="btn" id="exportBtn">📦 Экспортировать чат</button>
        <button class="btn btn-secondary" onclick="tg.close()">🔐 Закрыть</button>

        <div class="footer">ДААСС v2.0 • Бесплатно 7 дней</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe.user;
        if (user) {
            const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
            document.getElementById('userName').innerText = fullName || user.username || 'Гость';
            if (user.photo_url) {
                document.getElementById('userAvatar').src = user.photo_url;
            }
        }

        // Реферальная ссылка
        const userId = user?.id || '123456';
        document.getElementById('refLink').innerText = `https://t.me/SearchmusssicBOT?start=ref_${userId}`;

        // Выбор тарифа
        document.querySelectorAll('.plan').forEach(plan => {
            plan.addEventListener('click', () => {
                document.querySelectorAll('.plan').forEach(p => p.classList.remove('active'));
                plan.classList.add('active');
                tg.sendData(JSON.stringify({
                    action: 'select_plan',
                    days: plan.dataset.days,
                    price: plan.dataset.price
                }));
            });
        });

        // Экспорт чата
        document.getElementById('exportBtn').addEventListener('click', () => {
            tg.sendData(JSON.stringify({ action: 'export' }));
            tg.close();
        });

        // Имитация статистики (можно заменить на реальные данные)
        document.getElementById('msgCount').textContent = '124';
        document.getElementById('delCount').textContent = '7';
        document.getElementById('editCount').textContent = '3';
    </script>
</body>
</html>
